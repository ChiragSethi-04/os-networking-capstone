#cloud-config
# web VM: Nginx (TLS, reverse proxy, rate limit) + Apache (benchmark baseline) + Flask app
#
# Admin access: Multipass's own default "ubuntu" user (created automatically,
# already in the sudo group with passwordless sudo), not a separate "admin"
# user. A cloud-init `users:` block on this Multipass/image combination was
# found to hang the VM in the "Unknown" state indefinitely (it appears to
# interfere with Multipass's own guest-agent provisioning); see
# docs/decisions.md. Our key is added via the top-level `ssh_authorized_keys`
# module instead, which does not touch the `users:` module at all.
hostname: web
manage_etc_hosts: false

ssh_authorized_keys:
  - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAINYrfGW7wg/vagJcloVzw6gQyW/MxZzWW5K5FqYSDWoi capstone-admin

package_update: true
package_upgrade: false

packages:
  - nginx
  - apache2
  - apache2-utils
  - ufw
  - fail2ban
  - logrotate
  - sysstat
  - htop
  - tcpdump
  - curl
  - openssl
  - python3-venv
  - python3-pip
  - build-essential
  - libssl-dev
  - git
  - jq

runcmd:
  - [bash, -c, "systemctl stop apache2 || true"]
  - [bash, -c, "systemctl disable apache2 || true"]
  # Unattended-upgrades rebooted this VM mid-Phase-4 without warning once
  # (see docs/decisions.md); disabled here too so a fresh launch never hits
  # the same surprise, not just the already-running VMs patched live.
  - [bash, -c, "systemctl stop unattended-upgrades.service apt-daily-upgrade.timer apt-daily.timer 2>/dev/null || true"]
  - [bash, -c, "systemctl disable unattended-upgrades.service apt-daily-upgrade.timer apt-daily.timer 2>/dev/null || true"]
  - [bash, -c, "echo 'APT::Periodic::Enable \"0\";' > /etc/apt/apt.conf.d/52-capstone-no-auto-updates"]
  - [bash, -c, "echo 'Unattended-Upgrade::Automatic-Reboot \"false\";' >> /etc/apt/apt.conf.d/52-capstone-no-auto-updates"]
  - [bash, -c, "echo 'web VM base provisioning complete' > /var/log/capstone_provision.log"]
