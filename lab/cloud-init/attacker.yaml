#cloud-config
# attacker VM: used only against our own lab VMs (web, db) for the authorized
# security-testing experiments E4 to E9 in CLAUDE.md section 6.
hostname: attacker
manage_etc_hosts: true

users:
  - name: admin
    gecos: Capstone Admin
    groups: [sudo]
    shell: /bin/bash
    sudo: ["ALL=(ALL) NOPASSWD:ALL"]
    ssh_authorized_keys:
      - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAINYrfGW7wg/vagJcloVzw6gQyW/MxZzWW5K5FqYSDWoi capstone-admin

package_update: true
package_upgrade: false

packages:
  - nmap
  - nikto
  - hydra
  - apache2-utils
  - curl
  - tcpdump
  - git
  - build-essential
  - libssl-dev
  - jq

runcmd:
  - [bash, -c, "cd /opt && git clone --depth 1 https://github.com/drwetter/testssl.sh.git || true"]
  - [bash, -c, "chmod +x /opt/testssl.sh/testssl.sh || true"]
  - [bash, -c, "echo 'attacker VM base provisioning complete' > /var/log/capstone_provision.log"]
