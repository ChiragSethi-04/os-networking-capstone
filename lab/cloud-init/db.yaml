#cloud-config
# db VM: MariaDB, reachable only from the web VM IP (enforced by ufw in Phase 4)
#
# Admin access: Multipass's own default "ubuntu" user, not a separate "admin"
# user - see the comment in lab/cloud-init/web.yaml and docs/decisions.md
# for why (a `users:` cloud-config block hangs the VM on this setup).
hostname: db
manage_etc_hosts: false

ssh_authorized_keys:
  - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAINYrfGW7wg/vagJcloVzw6gQyW/MxZzWW5K5FqYSDWoi capstone-admin

package_update: true
package_upgrade: false

packages:
  - mariadb-server
  - ufw
  - sysstat
  - htop
  - curl
  - jq

runcmd:
  # Unattended-upgrades rebooted the web VM mid-Phase-4 without warning
  # once (see docs/decisions.md); disabled here too, pre-emptively.
  - [bash, -c, "systemctl stop unattended-upgrades.service apt-daily-upgrade.timer apt-daily.timer 2>/dev/null || true"]
  - [bash, -c, "systemctl disable unattended-upgrades.service apt-daily-upgrade.timer apt-daily.timer 2>/dev/null || true"]
  - [bash, -c, "echo 'APT::Periodic::Enable \"0\";' > /etc/apt/apt.conf.d/52-capstone-no-auto-updates"]
  - [bash, -c, "echo 'Unattended-Upgrade::Automatic-Reboot \"false\";' >> /etc/apt/apt.conf.d/52-capstone-no-auto-updates"]

runcmd:
  - [bash, -c, "echo 'db VM base provisioning complete' > /var/log/capstone_provision.log"]
