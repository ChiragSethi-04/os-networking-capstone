# Apache baseline config (web VM), identical site on port 8080, for E1/E2/E3
# comparison against Nginx on the same hardware. Kept stopped by default
# (systemctl disable apache2 in cloud-init); enabled only during benchmark runs
# via lab/scripts/enable_apache_baseline.sh.
Listen 8080

<VirtualHost *:8080>
    ServerName web
    DocumentRoot /var/www/html

    <Directory /var/www/html>
        Options -Indexes -FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    ServerTokens Prod
    ServerSignature Off

    ErrorLog ${APACHE_LOG_DIR}/meridian-8080-error.log
    CustomLog ${APACHE_LOG_DIR}/meridian-8080-access.log combined
</VirtualHost>
