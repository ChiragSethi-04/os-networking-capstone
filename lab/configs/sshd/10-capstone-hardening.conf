# Dropped into /etc/ssh/sshd_config.d/99-capstone-hardening.conf on web, db,
# and attacker. Applied with the admin session kept open, and a second
# terminal used to confirm a fresh key login works before closing it
# (see lab/scripts/harden.sh).
PermitRootLogin no
PasswordAuthentication no
AllowUsers ubuntu
MaxAuthTries 3
LoginGraceTime 30
PubkeyAuthentication yes
