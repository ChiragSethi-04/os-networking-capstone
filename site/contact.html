<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact - Meridian Logistics</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <header>
    <div class="brand">Meridian Logistics</div>
    <nav>
      <ul>
        <li><a href="/">Home</a></li>
        <li><a href="/about.html">About</a></li>
        <li><a href="/services.html">Services</a></li>
        <li><a href="/contact.html" class="active">Contact</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section>
      <h2>Contact us</h2>
      <p>Send a message and an account manager will follow up within one
        business day.</p>

      <form id="contact-form">
        <div>
          <label for="name">Name</label><br>
          <input type="text" id="name" name="name" required>
        </div>
        <div>
          <label for="email">Email</label><br>
          <input type="email" id="email" name="email" required>
        </div>
        <div>
          <label for="message">Message</label><br>
          <textarea id="message" name="message" required></textarea>
        </div>
        <button type="submit" class="btn">Send message</button>
        <div id="form-status" class="status-msg"></div>
      </form>
    </section>
  </main>

  <footer>
    &copy; 2026 Meridian Logistics. This is a fictional company created for an academic
    capstone project (OS &amp; Networking, Group 6).
  </footer>
  <script src="/js/script.js"></script>
</body>
</html>
